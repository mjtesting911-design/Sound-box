name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment (Android SDK, Keystore, Secrets)
        run: |
          # Configure SDK path
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ]; then
            echo "sdk.dir=$SDK_DIR" > local.properties
          fi

          # Accept Android SDK licenses
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

          # Prepare environment secrets
          cp .env.example .env 2>/dev/null || touch .env
          echo "GEMINI_API_KEY=" >> .env

          # Generate debug keystore for signing
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Locate APK
        id: apk_locator
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK_PATH"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySoundbox-Debug-APK
          path: ${{ steps.apk_locator.outputs.apk_path }}
          retention-days: 30

      - name: Create or Update GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name == 'master' && 'latest' || github.ref_name }}
          name: "My SoundBox APK Release (${{ github.ref_name }})"
          body: |
            ### 📱 My SoundBox: Smart UPI Payment Voice Alert
            
            Directly download and install the Debug APK on your Android device:
            - **Download:** Click on the `app-debug.apk` asset below.
            - **Instant Voice Alerts:** Announces incoming payments from GPay, PhonePe, Paytm, BHIM, Amazon Pay.
            - **100% Offline & Private:** Operates on-device with zero server sync.
          files: ${{ steps.apk_locator.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
